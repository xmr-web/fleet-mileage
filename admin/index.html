<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <div class="header-inner">
          <div class="logo">
            <span class="logo-icon">◈</span>
            <span class="logo-text">FLEET<strong>ADMIN</strong></span>
          </div>
          <nav class="tab-nav">
            <button class="tab-btn active" data-tab="vehicles">Vehicles</button>
            <button class="tab-btn" data-tab="mileage">Mileage</button>
            <button class="tab-btn" data-tab="qr">QR Codes</button>
          </nav>
       </div>
      </header>

      <main class="main-content">

        <!-- ── VEHICLES TAB ── -->
        <section class="tab-panel active" id="tab-vehicles">
          <div class="panel-header">
            <h1>Vehicles</h1>
          </div>

          <!-- Vehicle grid -->
          <div class="vehicle-grid" id="vehicle-grid">
            <div class="loading-state">Loading vehicles…</div>
          </div>
        </section>

        <!-- ── MILEAGE TAB ── -->
        <section class="tab-panel" id="tab-mileage">
          <div class="panel-header">
            <h1 id="mileage-tab-title">Mileage Collection</h1>
            <span class="week-badge" id="week-badge"></span>
          </div>
          <div class="collection-summary" id="collection-summary"></div>

          <!-- Pending list -->
          <div class="collection-section">
            <div class="collection-section-header">
              <span class="collection-section-label pending-label">Pending</span>
              <span class="collection-section-count" id="pending-count"></span>
            </div>
            <div class="collection-list" id="pending-list">
              <div class="loading-state">Loading…</div>
            </div>
          </div>

          <!-- Done list (collapsible) -->
          <div class="collection-section" id="done-section">
            <button class="collection-section-header collection-section-toggle" id="done-toggle">
              <span class="collection-section-label done-label">Done this week</span>
              <span class="collection-section-count" id="done-count"></span>
              <span class="toggle-chevron" id="done-chevron">›</span>
            </button>
            <div class="collection-list hidden" id="done-list"></div>
          </div>

          <!-- Vehicle(s) Out list (collapsible, hidden until at least one vehicle is out) -->
          <div class="collection-section hidden" id="out-section">
            <button class="collection-section-header collection-section-toggle" id="out-toggle">
              <span class="collection-section-label out-label">Vehicle(s) Out</span>
              <span class="collection-section-count" id="out-count"></span>
              <span class="toggle-chevron" id="out-chevron">›</span>
            </button>
            <div class="collection-list hidden" id="out-list"></div>
          </div>

          <!-- Close Week button: appears when pending=0 and out vehicles exist -->
          <button class="btn-close-week hidden" id="close-week-btn">Close Week &amp; Send Email</button>
        </section>

        <!-- ── QR CODES TAB ── -->
        <section class="tab-panel" id="tab-qr">
          <div class="panel-header">
            <h1>QR Codes</h1>
            <button class="btn-primary" onclick="window.print()">⎙ Print All</button>
          </div>
          <p class="qr-hint">Each QR code links directly to the mileage entry page for that vehicle. Print and affix inside the vehicle.</p>
          <div class="qr-grid" id="qr-grid">
            <div class="loading-state">Generating QR codes…</div>
          </div>
        </section>

      </main>
    </div>

    <!-- Mileage entry modal -->
    <div class="modal-overlay hidden" id="mileage-entry-modal">
      <div class="modal modal--sm">
        <div class="modal-header">
          <div>
            <div class="modal-vehicle-plate" id="entry-plate"></div>
            <div class="modal-vehicle-name" id="entry-name"></div>
          </div>
          <button class="modal-close" id="mileage-entry-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="entry-prev-row">
            <span class="entry-prev-label">Last recorded</span>
            <span class="entry-prev-value" id="entry-prev-mileage">—</span>
          </div>
          <div class="entry-input-wrap">
            <input
              type="number"
              id="entry-mileage-input"
              inputmode="numeric"
              pattern="[0-9]*"
              placeholder="0"
              min="0"
              autocomplete="off"
            />
          </div>
          <p class="entry-validation" id="entry-validation"></p>
          <button class="btn-primary entry-confirm-btn" id="entry-confirm-btn">Confirm Mileage</button>
          <button class="btn-out entry-out-btn" id="entry-out-btn">Vehicle Out</button>
        </div>
      </div>
    </div>

    <!-- History modal -->
    <div class="modal-overlay hidden" id="history-modal">
      <div class="modal">
        <div class="modal-header">
          <h2 id="modal-title">Mileage History</h2>
          <button class="modal-close" id="modal-close">✕</button>
        </div>
        <div class="modal-body" id="modal-body">
          <div class="loading-state">Loading…</div>
        </div>
      </div>
    </div>

    <script type="module" src="./admin.js"></script>
  </body>
</html>
