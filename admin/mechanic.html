<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleet Mechanic</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./admin.css" />
    <link rel="stylesheet" href="./mechanic.css" />
  </head>
  <body>
    <div id="app">

      <header class="site-header">
        <div class="header-inner">
          <div class="logo">
            <span class="logo-icon">◈</span>
            <span class="logo-text">FLEET<strong>MECHANIC</strong></span>
          </div>
          <nav class="tab-nav">
            <button class="tab-btn active" data-tab="mileage">Mileage</button>
            <button class="tab-btn" data-tab="faults">
              Faults
              <span class="tab-badge hidden" id="faults-badge"></span>
            </button>
            <button class="tab-btn" data-tab="maintenance">Maintenance</button>
          </nav>
          <a class="btn-icon mech-admin-link" href="./index.html">Admin ›</a>
        </div>
      </header>

      <main class="main-content">

        <!-- ══ MILEAGE TAB ══ -->
        <section class="tab-panel active" id="tab-mileage">
          <div class="panel-header">
            <h1>Mileage Collection</h1>
            <span class="week-badge" id="mileage-week-badge">Week —</span>
          </div>

          <p class="collection-summary" id="mileage-summary">Loading…</p>

          <!-- Pending -->
          <div class="collection-section" id="mileage-pending-section">
            <div class="collection-section-header">
              <span class="collection-section-label pending-label">Pending</span>
              <span class="collection-section-count" id="mileage-pending-count">0</span>
            </div>
            <div class="collection-list" id="mileage-pending-list">
              <div class="loading-state">Loading…</div>
            </div>
          </div>

          <!-- Collected -->
          <div class="collection-section" id="mileage-done-section">
            <button class="collection-section-header" id="mileage-done-toggle">
              <span class="collection-section-label done-label">Collected</span>
              <span class="collection-section-count" id="mileage-done-count">0</span>
              <span class="toggle-chevron" id="mileage-done-chevron">›</span>
            </button>
            <div class="collection-list hidden" id="mileage-done-list"></div>
          </div>
        </section>

        <!-- ══ FAULTS TAB ══ -->
        <section class="tab-panel" id="tab-faults">
          <div class="panel-header">
            <h1>Faults &amp; Issues</h1>
            <div class="mech-filter-row">
              <select class="mech-select" id="fault-status-filter">
                <option value="open">Open</option>
                <option value="in_progress">In Progress</option>
                <option value="all">All</option>
              </select>
            </div>
          </div>

          <div id="faults-list" class="mech-fault-list">
            <div class="loading-state">Loading…</div>
          </div>
        </section>

        <!-- ══ MAINTENANCE TAB ══ -->
        <section class="tab-panel" id="tab-maintenance">
          <div class="panel-header">
            <h1>Maintenance</h1>
          </div>

          <!-- Overdue checks -->
          <div class="mech-section">
            <div class="mech-section-header">
              <span class="mech-section-label overdue-label">Overdue Checks</span>
              <span class="mech-section-count" id="overdue-count">—</span>
            </div>
            <div id="overdue-list" class="mech-overdue-list">
              <div class="loading-state">Loading…</div>
            </div>
          </div>

          <!-- Threshold alerts -->
          <div class="mech-section" style="margin-top: 2rem;">
            <div class="mech-section-header">
              <span class="mech-section-label alert-label">Threshold Alerts</span>
              <span class="mech-section-count" id="alerts-count">—</span>
            </div>
            <p class="mech-section-hint">Checks where a measurement was below the alert threshold.</p>
            <div id="alerts-list" class="mech-alerts-list">
              <div class="loading-state">Loading…</div>
            </div>
          </div>
        </section>

      </main>
    </div>

    <!-- ══ FAULT DETAIL MODAL ══ -->
    <div class="modal-overlay hidden" id="fault-modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <div>
            <div class="modal-vehicle-plate" id="modal-plate"></div>
            <div class="modal-vehicle-name" id="modal-vehicle-name"></div>
          </div>
          <button class="modal-close" id="fault-modal-close">✕</button>
        </div>
        <div class="modal-body">
          <div class="mech-fault-detail" id="fault-detail-body">
            <!-- rendered by JS -->
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./mechanic.js"></script>
  </body>
</html>
