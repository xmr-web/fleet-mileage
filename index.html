<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleet Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header with Navigation -->
        <header class="site-header">
            <div class="header-inner">
                <div class="logo">
                    <span class="logo-icon">◈</span>
                    <span class="logo-text">FLEET<strong>SYSTEM</strong></span>
                </div>
                <nav class="tab-nav">
                    <button class="tab-btn nav-link" data-route="/garage">Garage</button>
                    <button class="tab-btn nav-link" data-route="/mechanic">Mechanic</button>
                    <button class="tab-btn nav-link" data-route="/manager">Manager</button>
                </nav>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Driver View (QR Code Access) -->
            <div id="driver-view" class="role-view" style="display: none;">
                <!-- Driver content handled by driver.js -->
            </div>

            <!-- Garage Assistant View -->
            <div id="garage-view" class="role-view" style="display: none;">
                <!-- Load garage HTML components -->
                <link rel="stylesheet" href="/css/garage.css">
                <div id="garage-container"></div>
            </div>

            <!-- Fleet Mechanic View -->
            <div id="mechanic-view" class="role-view" style="display: none;">
                <!-- Load mechanic HTML components -->
                <link rel="stylesheet" href="/css/mechanic.css">
                <div id="mechanic-container"></div>
            </div>

            <!-- Fleet Manager View -->
            <div id="manager-view" class="role-view" style="display: none;">
                <div class="coming-soon">
                    <h2>Fleet Manager Dashboard</h2>
                    <p>Coming soon - vehicle bookings and driver reports</p>
                </div>
            </div>

        </main>
    </div>

    <!-- Load Services -->
    <script type="module" src="services/router.js"></script>
    <script type="module" src="services/supabase.js"></script>

    <!-- Load Components -->
    <script type="module" src="components/driver/driver.js"></script>
    <script type="module" src="components/garage/garage.js"></script>
    <script type="module" src="components/mechanic/mechanic.js"></script>
    <script type="module" src="components/manager/manager.js"></script>

    <!-- Initialize App -->
    <script type="module">
        import { router } from './services/router.js';
        
        // App initialization happens in router.js
        console.log('Fleet Management System loaded');
        console.log('Current route:', router.currentRoute);
    </script>
</body>
</html>
